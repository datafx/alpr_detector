[platformio]
default_envs = esp32dev

[env:esp32dev]
platform  = espressif32
board     = esp32dev
framework = arduino

monitor_speed = 115200
upload_speed  = 921600

; Default partition table reserves space for OTA (dual app slots); this
; firmware has no OTA update path, so use a single ~3MB app partition instead.
board_build.partitions = huge_app.csv

lib_deps =
    olikraus/U8g2 @ ^2.35.30

build_flags =
    -DCORE_DEBUG_LEVEL=0

; Bench diagnostics: prints received BLE adverts (named or signature-matched)
; over serial. Never flash this for real use - the product does no logging.
;   pio run -e esp32dev_debug -t upload
[env:esp32dev_debug]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -DDEBUG_BLE_SCAN
